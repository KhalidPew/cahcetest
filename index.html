
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            background: #f4f4f4;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #0002;
        }

        img {
            max-width: 100%;
            width: 400px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .download {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 14px 25px;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 15px;
        }

        .download:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Welcome to My Website!</h1>

        <p>Hello! Welcome to my little corner of the internet.</p>

        <!-- Website image -->
        <img src="images/image.png" alt="My Image">

        <h2>Downloads</h2>

        <p>Click below to download my file.</p>

        <!-- Download file -->
        <a class="download" href="files/document.pdf" download>
            Download File
        </a>

    </div>

</body>
</html>
