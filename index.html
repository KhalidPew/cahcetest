
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document.pdf</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
        }

        .container {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .png-below-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .png-below-wrapper img {
            display: block;
            max-width: 90%;
            height: auto;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="png-below-wrapper">

            <img src="images/image1.png" alt="First image">

            <img src="images/image2.png" alt="Second image">

        </div>
    </div>

</body>
</html>
