<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Viewer</title>
<style>

.small-img {
  width: 0.1px;
  height: auto;
}
:root{
  --bg:#e6e6e6; --bar:#fbfbfb; --line:#d1d1d1; --text:#242424; --muted:#616161;
  --hover:#e8e8e8; --active:#d6d6d6; --accent:#0f6cbd; --side:#f3f3f3; --sel:rgba(15,108,189,.35);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#3b3b3b; --bar:#292929; --line:#424242; --text:#f5f5f5; --muted:#adadad;
    --hover:#3a3a3a; --active:#4a4a4a; --accent:#479ef5; --side:#2f2f2f; --sel:rgba(71,158,245,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#3b3b3b; --bar:#292929; --line:#424242; --text:#f5f5f5; --muted:#adadad;
  --hover:#3a3a3a; --active:#4a4a4a; --accent:#479ef5; --side:#2f2f2f; --sel:rgba(71,158,245,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);
  font:14px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden}

/* toolbar */
#bar{height:48px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px;
  background:var(--bar);border-bottom:1px solid var(--line);z-index:5}
#bar .grp{display:flex;align-items:center;gap:2px}
#name{font-weight:600;max-width:28vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 8px 0 4px}
.sp{flex:1}
.sep{width:1px;height:20px;background:var(--line);margin:0 6px}
button{all:unset;box-sizing:border-box;width:34px;height:34px;display:grid;place-items:center;border-radius:4px;
  cursor:pointer;color:var(--text)}
button:hover{background:var(--hover)}
button:active{background:var(--active)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
button[disabled]{opacity:.4;pointer-events:none}
button[aria-pressed="true"]{background:var(--active)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#pg{width:44px;height:28px;text-align:center;font:inherit;color:var(--text);background:transparent;
  border:1px solid var(--line);border-radius:4px}
#pg:focus{border-color:var(--accent);outline:none}
#total{color:var(--muted);margin:0 6px 0 6px;min-width:34px}
#zoom{min-width:48px;text-align:center}

/* body */
#main{flex:1;display:flex;min-height:0;position:relative}
#side{width:168px;flex:none;background:var(--side);border-right:1px solid var(--line);overflow:auto;
  padding:14px 0;display:none;text-align:center}
#side.on{display:block}
.th{display:inline-block;margin:0 0 14px;padding:6px;border-radius:6px;cursor:pointer;border:2px solid transparent}
.th:hover{background:var(--hover)}
.th.cur{border-color:var(--accent)}
.th canvas{display:block;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.th span{display:block;margin-top:4px;font-size:12px;color:var(--muted)}
#view{flex:1;overflow:auto;position:relative;padding:12px 0 24px;scroll-behavior:auto}
.page{position:relative;margin:0 auto 12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.08);
  flex:none}
.page canvas{display:block;position:absolute;inset:0}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;text-size-adjust:none}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}
.textLayer ::selection{background:var(--sel)}
#view.wide .page{margin-left:12px;margin-right:12px}

/* empty state */
#empty{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;text-align:center;
  padding:24px;background:var(--bg);z-index:2}
#empty h1{font-size:20px;font-weight:600;margin:0}
#empty p{margin:0;color:var(--muted)}
#empty .go{all:unset;box-sizing:border-box;margin-top:14px;padding:8px 20px;height:auto;width:auto;border-radius:4px;
  background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
#empty .go:hover{filter:brightness(1.1)}
#empty .go:focus-visible{outline:2px solid var(--text);outline-offset:2px}
#err{color:#d13438;margin-top:10px;min-height:1.4em}
body.drag #main::after{content:"Drop PDF to open";position:absolute;inset:8px;display:grid;place-items:center;z-index:9;
  border:2px dashed var(--accent);border-radius:8px;background:rgba(15,108,189,.12);font-size:18px;font-weight:600;pointer-events:none}
#busy{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:var(--bar);border:1px solid var(--line);
  padding:6px 14px;border-radius:16px;z-index:6;display:none}

@media (max-width:760px){
  #name,.sep,#total{display:none}
  #side{position:absolute;z-index:4;top:0;bottom:0;left:0}
}
</style>
</head>
<body>
    <img class="small-img" src="images/image.png">

<div id="bar" role="toolbar" aria-label="PDF toolbar">
  <div class="grp">
    <button id="bSide" title="Thumbnails" aria-label="Toggle thumbnails" aria-pressed="false" disabled><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
    <div id="name">PDF Viewer</div>
  </div>
  <div class="sp"></div>
  <div class="grp">
    <input id="pg" type="text" inputmode="numeric" value="" aria-label="Page number" disabled>
    <span id="total">/ 0</span>
    <span class="sep"></span>
    <button id="bOut" title="Zoom out (Ctrl + −)" aria-label="Zoom out" disabled><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <span id="zoom">100%</span>
    <button id="bIn" title="Zoom in (Ctrl + +)" aria-label="Zoom in" disabled><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="bFit" title="Fit to page" aria-label="Fit to page" disabled></button>
    <button id="bRot" title="Rotate clockwise" aria-label="Rotate clockwise" disabled><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
  </div>
  <div class="sp"></div>
  <div class="grp">
    <button id="bOpen" title="Open file (Ctrl + O)" aria-label="Open file"><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
    <button id="bPrint" title="Print (Ctrl + P)" aria-label="Print" disabled><svg class="i" viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v7H7z"/></svg></button>
    <button id="bSave" title="Save a copy (Ctrl + S)" aria-label="Save a copy" disabled><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
  </div>
</div>

<div id="main">
  <aside id="side" aria-label="Page thumbnails"></aside>
  <div id="view" tabindex="0" aria-label="Document"></div>
  <div id="busy">Loading…</div>
  <div id="empty">
    <h1>Open a PDF</h1>
    <p>Drag a file here, or choose one from your computer.</p>
    <button class="go" id="bGo">Choose file</button>
    <div id="err" role="alert"></div>
  </div>
</div>
<input id="file" type="file" accept="application/pdf,.pdf" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
  "use strict";

  /* Set this to your PDF's path or URL. Relative paths resolve from this page.
     Leave it as "" to show the file picker instead. */
  var PDF_PATH = "document.pdf";

  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  var $ = function(s){ return document.querySelector(s); };
  var view = $("#view"), side = $("#side"), pgIn = $("#pg"), totalEl = $("#total"), zoomEl = $("#zoom");
  var STEPS = [0.25,0.33,0.5,0.67,0.75,0.8,0.9,1,1.1,1.25,1.5,1.75,2,2.5,3,4,5];
  var ICON_WIDTH = '<svg class="i" viewBox="0 0 24 24"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg>';
  var ICON_PAGE  = '<svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';

  var S = { doc:null, bytes:null, name:"", mode:"width", scale:1, rot:0, gen:0, pages:[], thumbs:[], cur:1, base:null, obs:null, tobs:null };

  /* ---------- loading ---------- */
  function showError(msg){ $("#err").textContent = msg || ""; }
  function busy(on){ $("#busy").style.display = on ? "block" : "none"; }

  async function openBuffer(buf, name){
    busy(true); showError("");
    try{
      var task = pdfjsLib.getDocument({ data: buf.slice(0) });
      task.onPassword = function(cb, reason){
        var p = window.prompt(reason === 2 ? "Wrong password. Try again:" : "This PDF is password protected. Enter the password:");
        if(p === null){ task.destroy(); } else { cb(p); }
      };
      var doc = await task.promise;
      if(S.doc){ S.doc.destroy(); }
      S.doc = doc; S.bytes = buf; S.name = name || "document.pdf"; S.rot = 0; S.mode = "width"; S.cur = 1;
      var p1 = await doc.getPage(1);
      var v = p1.getViewport({ scale:1 });
      S.base = { w:v.width, h:v.height, r:p1.rotate };
      document.title = S.name;
      $("#name").textContent = S.name;
      totalEl.textContent = "/ " + doc.numPages;
      pgIn.value = 1;
      ["#bSide","#bOut","#bIn","#bFit","#bRot","#bPrint","#bSave"].forEach(function(s){ $(s).disabled = false; });
      pgIn.disabled = false;
      $("#empty").style.display = "none";
      view.scrollTop = 0;
      await build();
      buildThumbs();
    }catch(e){
      if(e && e.name === "PasswordException"){ showError("A password is needed to open this file."); }
      else { showError("This file could not be opened. Make sure it is a valid PDF."); }
      console.error(e);
    }finally{ busy(false); }
  }

  async function openFile(f){
    if(!f) return;
    if(f.type && f.type !== "application/pdf" && !/\.pdf$/i.test(f.name)){ showError("That is not a PDF file."); return; }
    openBuffer(await f.arrayBuffer(), f.name);
  }

  /* ---------- layout ---------- */
  function dims(){
    var r = S.base.r, swap = ((r + S.rot) / 90) % 2 !== 0;
    return swap ? { w:S.base.h, h:S.base.w } : { w:S.base.w, h:S.base.h };
  }
  function calcScale(){
    if(S.mode === "custom") return S.scale;
    var d = dims(), aw = view.clientWidth - 32, ah = view.clientHeight - 32;
    var sw = aw / d.w;
    return Math.max(0.1, S.mode === "width" ? sw : Math.min(sw, ah / d.h));
  }
  function setFitIcon(){
    var b = $("#bFit");
    b.innerHTML = S.mode === "page" ? ICON_WIDTH : ICON_PAGE;
    var t = S.mode === "page" ? "Fit to width" : "Fit to page";
    b.title = t; b.setAttribute("aria-label", t);
  }

  async function build(){
    if(!S.doc) return;
    var gen = ++S.gen;
    var frac = view.scrollHeight ? view.scrollTop / view.scrollHeight : 0;
    S.pages.forEach(function(p){ if(p.task){ try{ p.task.cancel(); }catch(e){} } });
    if(S.obs) S.obs.disconnect();
    view.innerHTML = ""; S.pages = [];
    S.scale = calcScale();
    zoomEl.textContent = Math.round(S.scale * 100) + "%";
    setFitIcon();
    var d = dims(), w = d.w * S.scale, h = d.h * S.scale;
    S.obs = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ var p = S.pages[+e.target.dataset.n - 1]; if(p && !p.done){ p.done = true; renderPage(p, gen); } } });
    }, { root:view, rootMargin:"900px 0px" });
    for(var i = 1; i <= S.doc.numPages; i++){
      var el = document.createElement("div");
      el.className = "page"; el.dataset.n = i;
      el.style.width = w + "px"; el.style.height = h + "px";
      view.appendChild(el);
      S.pages.push({ n:i, el:el, done:false, task:null });
      S.obs.observe(el);
    }
    view.scrollTop = frac * view.scrollHeight;
    updateCur();
  }

  async function renderPage(p, gen){
    try{
      var page = await S.doc.getPage(p.n);
      if(gen !== S.gen) return;
      var vp = page.getViewport({ scale:S.scale, rotation:(page.rotate + S.rot) % 360 });
      p.el.style.width = vp.width + "px"; p.el.style.height = vp.height + "px";
      var dpr = window.devicePixelRatio || 1, c = document.createElement("canvas");
      c.width = Math.floor(vp.width * dpr); c.height = Math.floor(vp.height * dpr);
      c.style.width = vp.width + "px"; c.style.height = vp.height + "px";
      p.task = page.render({ canvasContext:c.getContext("2d"), viewport:vp, transform: dpr !== 1 ? [dpr,0,0,dpr,0,0] : null });
      await p.task.promise;
      if(gen !== S.gen) return;
      p.el.appendChild(c);
      var tl = document.createElement("div");
      tl.className = "textLayer"; tl.style.setProperty("--scale-factor", vp.scale);
      p.el.appendChild(tl);
      pdfjsLib.renderTextLayer({ textContentSource: await page.getTextContent(), container: tl, viewport: vp, textDivs: [] });
    }catch(e){
      if(!e || e.name !== "RenderingCancelledException"){ console.error(e); }
    }
  }

  /* ---------- thumbnails ---------- */
  function buildThumbs(){
    if(S.tobs) S.tobs.disconnect();
    side.innerHTML = ""; S.thumbs = [];
    var d = dims(), tw = 120, ts = tw / d.w, th = d.h * ts;
    S.tobs = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(e.isIntersecting){
          var t = S.thumbs[+e.target.dataset.n - 1];
          if(t && !t.done){ t.done = true; renderThumb(t); }
        }
      });
    }, { root:side, rootMargin:"400px 0px" });
    for(var i = 1; i <= S.doc.numPages; i++){
      var b = document.createElement("div");
      b.className = "th"; b.dataset.n = i;
      b.innerHTML = '<div class="box" style="width:' + tw + 'px;height:' + th + 'px"></div><span>' + i + "</span>";
      b.addEventListener("click", (function(n){ return function(){ goTo(n); }; })(i));
      side.appendChild(b);
      S.thumbs.push({ n:i, el:b, done:false, ts:ts });
      S.tobs.observe(b);
    }
    markCur();
  }
  async function renderThumb(t){
    var doc = S.doc;
    try{
      var page = await doc.getPage(t.n);
      if(doc !== S.doc) return;
      var vp = page.getViewport({ scale:120 / page.getViewport({ scale:1, rotation:(page.rotate + S.rot) % 360 }).width, rotation:(page.rotate + S.rot) % 360 });
      var c = document.createElement("canvas"), dpr = window.devicePixelRatio || 1;
      c.width = Math.floor(vp.width * dpr); c.height = Math.floor(vp.height * dpr);
      c.style.width = vp.width + "px"; c.style.height = vp.height + "px";
      await page.render({ canvasContext:c.getContext("2d"), viewport:vp, transform: dpr !== 1 ? [dpr,0,0,dpr,0,0] : null }).promise;
      var box = t.el.querySelector(".box");
      box.style.cssText = ""; box.appendChild(c);
    }catch(e){ console.error(e); }
  }

  /* ---------- navigation ---------- */
  function goTo(n){
    if(!S.doc) return;
    n = Math.min(Math.max(1, n), S.doc.numPages);
    var p = S.pages[n - 1];
    if(p){ view.scrollTop = p.el.offsetTop - 12; }
  }
  function markCur(){
    S.thumbs.forEach(function(t){ t.el.classList.toggle("cur", t.n === S.cur); });
    var t = S.thumbs[S.cur - 1];
    if(t && side.classList.contains("on")){
      var top = t.el.offsetTop, bot = top + t.el.offsetHeight;
      if(top < side.scrollTop || bot > side.scrollTop + side.clientHeight){ side.scrollTop = top - 40; }
    }
  }
  function updateCur(){
    if(!S.pages.length) return;
    var y = view.scrollTop + view.clientHeight / 3, n = 1;
    for(var i = 0; i < S.pages.length; i++){ if(S.pages[i].el.offsetTop <= y) n = i + 1; else break; }
    if(n !== S.cur || document.activeElement !== pgIn){ S.cur = n; if(document.activeElement !== pgIn) pgIn.value = n; markCur(); }
  }
  var ticking = false;
  view.addEventListener("scroll", function(){
    if(ticking) return; ticking = true;
    requestAnimationFrame(function(){ ticking = false; updateCur(); });
  });

  /* ---------- zoom / rotate ---------- */
  function zoomStep(dir){
    var s = S.scale, i;
    if(dir > 0){ for(i = 0; i < STEPS.length; i++){ if(STEPS[i] > s + 0.005){ s = STEPS[i]; break; } } if(i === STEPS.length) s = STEPS[STEPS.length - 1]; }
    else { for(i = STEPS.length - 1; i >= 0; i--){ if(STEPS[i] < s - 0.005){ s = STEPS[i]; break; } } if(i < 0) s = STEPS[0]; }
    S.mode = "custom"; S.scale = s; build();
  }
  function reset(){ S.mode = "width"; build(); }

  $("#bIn").onclick = function(){ zoomStep(1); };
  $("#bOut").onclick = function(){ zoomStep(-1); };
  $("#bFit").onclick = function(){ S.mode = S.mode === "page" ? "width" : "page"; build(); };
  $("#bRot").onclick = function(){ S.rot = (S.rot + 90) % 360; build(); buildThumbs(); };
  $("#bSide").onclick = function(){
    var on = side.classList.toggle("on");
    this.setAttribute("aria-pressed", on);
    if(S.mode !== "custom") build();
    markCur();
  };

  var wheelT = 0;
  view.addEventListener("wheel", function(e){
    if(!(e.ctrlKey || e.metaKey) || !S.doc) return;
    e.preventDefault();
    var now = Date.now(); if(now - wheelT < 90) return; wheelT = now;
    zoomStep(e.deltaY < 0 ? 1 : -1);
  }, { passive:false });

  var rz; window.addEventListener("resize", function(){
    clearTimeout(rz); rz = setTimeout(function(){ if(S.doc && S.mode !== "custom") build(); }, 150);
  });

  /* ---------- page box ---------- */
  pgIn.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ var n = parseInt(pgIn.value, 10); if(!isNaN(n)) goTo(n); pgIn.blur(); view.focus(); }
    if(e.key === "Escape"){ pgIn.value = S.cur; pgIn.blur(); }
  });
  pgIn.addEventListener("focus", function(){ pgIn.select(); });
  pgIn.addEventListener("blur", function(){ pgIn.value = S.cur; });

  /* ---------- save / print ---------- */
  function save(){
    if(!S.bytes) return;
    var url = URL.createObjectURL(new Blob([S.bytes], { type:"application/pdf" }));
    var a = document.createElement("a"); a.href = url; a.download = S.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }
  function print(){
    if(!S.bytes) return;
    var url = URL.createObjectURL(new Blob([S.bytes], { type:"application/pdf" }));
    var f = document.createElement("iframe");
    f.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
    f.src = url; document.body.appendChild(f);
    f.onload = function(){
      try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ window.open(url); }
      setTimeout(function(){ f.remove(); URL.revokeObjectURL(url); }, 60000);
    };
  }
  $("#bSave").onclick = save;
  $("#bPrint").onclick = print;

  /* ---------- open ---------- */
  var input = $("#file");
  function pick(){ input.value = ""; input.click(); }
  $("#bOpen").onclick = pick; $("#bGo").onclick = pick;
  input.onchange = function(){ openFile(input.files[0]); };

  var depth = 0;
  window.addEventListener("dragenter", function(e){ e.preventDefault(); depth++; document.body.classList.add("drag"); });
  window.addEventListener("dragleave", function(){ depth = Math.max(0, depth - 1); if(!depth) document.body.classList.remove("drag"); });
  window.addEventListener("dragover", function(e){ e.preventDefault(); });
  window.addEventListener("drop", function(e){
    e.preventDefault(); depth = 0; document.body.classList.remove("drag");
    if(e.dataTransfer.files.length) openFile(e.dataTransfer.files[0]);
  });

  /* ---------- keyboard ---------- */
  window.addEventListener("keydown", function(e){
    var mod = e.ctrlKey || e.metaKey, k = e.key;
    if(mod && k.toLowerCase() === "o"){ e.preventDefault(); pick(); }
    else if(mod && k.toLowerCase() === "p" && S.doc){ e.preventDefault(); print(); }
    else if(mod && k.toLowerCase() === "s" && S.doc){ e.preventDefault(); save(); }
    else if(mod && (k === "+" || k === "=") && S.doc){ e.preventDefault(); zoomStep(1); }
    else if(mod && k === "-" && S.doc){ e.preventDefault(); zoomStep(-1); }
    else if(mod && k === "0" && S.doc){ e.preventDefault(); reset(); }
    else if(!mod && S.doc && document.activeElement.tagName !== "INPUT"){
      if(k === "Home"){ e.preventDefault(); view.scrollTop = 0; }
      else if(k === "End"){ e.preventDefault(); view.scrollTop = view.scrollHeight; }
      else if(k === "ArrowRight" && S.mode === "page"){ goTo(S.cur + 1); }
      else if(k === "ArrowLeft" && S.mode === "page"){ goTo(S.cur - 1); }
    }
  });

  /* ?file=https://… opens a PDF from a URL (must allow cross-origin access) */
  var u = new URLSearchParams(location.search).get("file") || PDF_PATH;
  if(u){
    busy(true);
    fetch(u).then(function(r){ if(!r.ok) throw 0; return r.arrayBuffer(); })
      .then(function(b){ openBuffer(b, decodeURIComponent(u.split("/").pop().split("?")[0]) || "document.pdf"); })
      .catch(function(){ busy(false); showError("Could not load that URL."); });
  }
})();
</script>
</body>
</html>
